<div class="ap ap-partner" data-example="cofit">
  <div class="ap-bleed ap-bg--mist" aria-hidden="true"></div>
  <div class="ap-sec ap-layer">
    <div class="ap-split">
      <div class="ap-split__text">
        <h2 class="ap-h2">Cofit ——<br>診所的外掛健康管理團隊</h2>
        <p class="ap-intro">醫師專注醫療判斷，Cofit 接手後續的營養與健康管理，讓病人離開診間後，仍有專業團隊持續協助。</p>
      </div>

      <div class="ap-journey" role="img" aria-label="從診間到日常：醫師完成專業判斷後，由營養師線上持續陪伴病人">
        <figure class="ap-scene ap-scene--clinic">
          <div class="ap-scene__art"><img src="{{img:library/ip_s2-clinic.webp}}" alt="" width="300" height="182"></div>
          <figcaption><b>診間</b>醫師完成專業判斷</figcaption>
        </figure>
        <div class="ap-journey__gap" aria-hidden="true"></div>
        <figure class="ap-scene ap-scene--daily">
          <div class="ap-scene__art"><img src="{{img:library/ip_s2-daily.webp}}" alt="" width="300" height="174"></div>
          <figcaption><b>日常</b>營養師線上持續陪伴</figcaption>
        </figure>
        <svg class="ap-journey__arc" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="apJourney" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B70B1"/><stop offset="1" stop-color="#49AE86"/></linearGradient></defs>
          <path d="M38.1 64.4C44.6 10.4 60.8 10.3 68.8 44.3" fill="none" stroke="url(#apJourney)" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <span class="ap-journey__dot" style="left:38.1%;top:calc(var(--ap-scene-h) * .644);background:var(--ap-ink)" aria-hidden="true"></span>
        <span class="ap-journey__dot" style="left:68.8%;top:calc(var(--ap-scene-h) * .443);background:var(--ap-accent)" aria-hidden="true"></span>
      </div>
    </div>

    <ol class="ap-points">
      <li>
        <h3 class="ap-points__title"><span class="ap-no">01</span>專業營養師直接接手</h3>
        <p>由 Cofit 營養師負責後續說明與營養服務，診所不需另外招募或管理營養人力。</p>
      </li>
      <li>
        <h3 class="ap-points__title"><span class="ap-no">02</span>服務有流程，進度有追蹤</h3>
        <p>透過健康管理流程與線上工具持續記錄服務進度，讓病人的健康管理不只停留在一次性的診間建議。</p>
      </li>
      <li>
        <h3 class="ap-points__title"><span class="ap-no">03</span>交易與客服由 Cofit 處理</h3>
        <p>Cofit 負責後續交易、出貨與客服支援；診所不用先行囤貨，也不需自行處理訂單與產品問題。</p>
      </li>
    </ol>
  </div>
</div>

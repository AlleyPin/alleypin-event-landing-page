<!-- 講者。照片沒到之前用色塊＋「照片待補」，不要放假照片 -->
<div class="ap ap-s3">
  <div class="ap-bleed ap-bg--mist" aria-hidden="true"></div>
  <div class="ap-sec ap-layer">
    <h2 class="ap-h2">講者資訊</h2>
    <div class="ap-speakers">
      <article class="ap-speaker">
        <div class="ap-speaker__photo" aria-hidden="true"><span>照片待補</span></div>
        <!-- 有照片時：<img class="ap-speaker__photo" src="{{img:speaker_xxx.webp}}" alt="姓名" width="120" height="120"> -->
        <div class="ap-speaker__info">
          <p class="ap-speaker__role">〔待填：講者職稱〕</p>
          <h3 class="ap-speaker__name">〔待填：講者姓名〕</h3>
          <p class="ap-speaker__bio">〔待填：講者介紹〕</p>
        </div>
      </article>
    </div>
  </div>
</div>

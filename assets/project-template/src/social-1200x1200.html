<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<!-- 社群宣傳圖 1200×1200：KV 元素重排；標籤與膠囊文字都要取自票上 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/*{{SHARED}}*/
@page{ size:1200px 1200px; margin:0; }
html,body{ margin:0; width:1200px; height:1200px; overflow:hidden; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.img{ position:relative; width:1200px; height:1200px; overflow:hidden; font-size:16px; }
.img .ap-kv__bg{ position:absolute; inset:0; left:0; width:100%; }
.img .ap-kv__illus{ left:400px; top:80px; width:740px; animation:none; }
.img .brand{ position:absolute; z-index:2; left:88px; top:80px; }
.img .ap-brand img{ height:46px; }
.img .ap-brand__x{ font-size:26px; }
.img .content{ position:absolute; z-index:2; left:88px; bottom:96px; width:1024px; }
.img .tag{ display:inline-block; padding:8px 22px; border-radius:999px; background:var(--ap-ink); color:#FFFFFF; font-family:var(--ap-font-display); font-weight:700; font-size:24px; letter-spacing:.04em; }
.img .ap-kv__title{ margin-top:28px; font-size:72px; line-height:1.3; text-wrap:nowrap; }
.img .ap-kv__lead{ margin-top:22px; font-size:28px; }
.img .row{ margin-top:40px; display:flex; align-items:center; gap:28px; }
.img .ap-when{ margin-top:0; padding:22px 30px; border-radius:24px; }
.img .ap-when__date, .img .ap-when__time{ font-size:27px; }
.img .ap-when__place{ font-size:24px; }
.img .ap-when__row svg{ width:28px; height:28px; }
.img .pill{ display:inline-flex; align-items:center; height:76px; padding:0 44px; border-radius:999px; background:var(--ap-cta); color:var(--ap-cta-text); font-weight:700; font-size:30px; letter-spacing:.06em; box-shadow:0 16px 32px -16px var(--ap-cta-shadow); }
</style></head>
<body>
<div class="ap img">
  <div class="ap-kv__bg"></div>
{{include:_kv-art.html}}
  <div class="brand">
{{include:_brand.html}}
  </div>
  <div class="content">
    <span class="tag">〔待填：活動類型，例：線上說明會〕</span>
    <h1 class="ap-kv__title">〔待填：主標上半〕，<br>〔待填：主標下半〕</h1>
    <p class="ap-kv__lead">〔待填：副標一句〕</p>
    <div class="row">
{{include:_when.html}}
      <span class="pill">〔待填：立即免費報名〕</span>
    </div>
  </div>
</div>
</body></html>
